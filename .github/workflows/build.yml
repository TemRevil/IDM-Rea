name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/IDMRea.Core.Tests -c Release
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: ./scripts/publish-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: IDM-Rea-windows-x64
          path: artifacts/windows/
      - name: Run actual WinUI application and capture desktop
        run: ./scripts/capture-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IDM-Rea-runtime-screenshots
          path: artifacts/screenshots/
          if-no-files-found: warn
